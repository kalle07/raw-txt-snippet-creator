name: Update Download Counter

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-download-counter
  cancel-in-progress: true

jobs:
  update-counter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get total download count for all .exe assets
        id: count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          API_URL="https://api.github.com/repos/${{ github.repository }}/releases?per_page=100"
          TOTAL=0

          while [ -n "$API_URL" ]; do
            RESPONSE=$(curl -fsSL \
              -D "$RUNNER_TEMP/headers.txt" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API_URL")

            COUNT=$(echo "$RESPONSE" | jq -r '
              [.[] | .assets[]? | select(.name | test("\\.exe$"; "i")) | .download_count]
              | add // 0
            ')

            TOTAL=$((TOTAL + COUNT))

            NEXT_URL=$(awk -F'[<>]' '
              tolower($0) ~ /link:/ && $0 ~ /rel="next"/ { print $2 }
            ' "$RUNNER_TEMP/headers.txt" | tail -n 1)

            API_URL="$NEXT_URL"
          done

          echo "Total .exe downloads: $TOTAL"
          echo "count=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Update README
        run: |
          set -euo pipefail

          RAW_COUNT="${{ steps.count.outputs.count }}"
          COUNT=$(printf "%03d" "$RAW_COUNT")

          sed -i -E \
            's/(<!--download-count-->)[0-9]+(<!--\/download-count-->)/\1'"$COUNT"'\2/' \
            README.md

      - name: Commit changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "docs: update download counter to ${{ steps.count.outputs.count }}"
          git push
